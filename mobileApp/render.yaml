# Preparation only. Apply only after operator review and environment setup.
services:
  - type: web
    name: zinc-api
    runtime: docker
    plan: starter
    dockerfilePath: ./mobileApp/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL
        sync: false
      - key: CORS_ORIGINS
        sync: false
